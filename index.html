<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PaedTraches" />
    <title>PaedTraches — Paediatric Tracheostomy Guide</title>
    <link id="apple-icon" rel="apple-touch-icon" sizes="180x180" href="" />
    <link id="fav-icon" rel="icon" type="image/png" href="" />
    <script>
      (function () {
        var c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        var ctx = c.getContext('2d');
        var g = ctx.createLinearGradient(0, 0, 512, 512);
        g.addColorStop(0, '#10b981');
        g.addColorStop(1, '#0f766e');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = '#ffffff';
        ctx.fillStyle = '#ffffff';
        ctx.lineWidth = 28;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.roundRect(84, 152, 344, 78, 39);
        ctx.stroke();
        ctx.beginPath();
        ctx.roundRect(202, 88, 108, 64, 14);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(216, 230);
        ctx.quadraticCurveTo(216, 382, 326, 408);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(296, 230);
        ctx.quadraticCurveTo(296, 336, 368, 354);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(144, 191, 14, 0, Math.PI * 2);
        ctx.arc(368, 191, 14, 0, Math.PI * 2);
        ctx.fill();
        var png = c.toDataURL('image/png');
        document.getElementById('apple-icon').href = png;
        document.getElementById('fav-icon').href = png;
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
